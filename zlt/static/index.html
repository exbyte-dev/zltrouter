<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>zlt · signal</title>
<script>
  /* Set the theme before first paint: no flash of the wrong background.
     Explicit choice wins; otherwise follow the OS.

     This is the one script that stays inline. Everything else is a file under
     /static/js/, but this has to run before the first paint, and an external
     file puts a round trip in front of that. The toggle half lives in
     /static/js/theme.js. */
  (function () {
    var t = "light";
    try {
      var saved = localStorage.getItem("zlt-theme");
      t = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (e) {}
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
  <header>
    <span class="wordmark">zlt</span>
    <span class="host" id="host"></span>
    <span class="session"><span class="dot" id="dot"></span><span id="sessionWord">connecting</span></span>
    <button class="theme" id="theme" aria-label="Switch to dark theme">
      <svg class="moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5"/>
        <path d="M12 1.5v2M12 20.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1.5 12h2M20.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
      </svg>
    </button>
  </header>
  <div id="banner" role="alert"></div>
  <div id="note"></div>

  <!-- The meter and the tab bar are pinned together: whichever tool you are
       using, the reading this dashboard exists to show stays on screen. -->
  <div class="headbar" id="headbar">
    <div class="hero">
      <div class="label" id="bigLabel">RSRP</div>
      <div class="big"><span id="bigVal"></span><small>dBm</small></div>
      <div class="quality" id="qualityWord">loading&hellip;</div>
    </div>

    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    <div class="bar-ends"><span id="barMin"></span><span id="barMax"></span></div>

    <nav class="tabs" role="tablist" aria-label="Dashboard sections">
      <button class="tab" id="tab-signal" role="tab" aria-controls="signal-panel"
              aria-selected="true">Signal</button>
      <button class="tab" id="tab-messages" role="tab" aria-controls="sms-panel"
              aria-selected="false">Messages<span class="tab-badge" id="sms-badge"></span></button>
      <button class="tab" id="tab-ussd" role="tab" aria-controls="ussd-panel"
              aria-selected="false">USSD</button>
      <button class="tab" id="tab-speed" role="tab" aria-controls="speed-panel"
              aria-selected="false">Speed</button>
    </nav>
  </div>

  <div id="signal-panel" role="tabpanel" aria-labelledby="tab-signal">
    <section>
      <h2>Network mode</h2>
      <div class="seg" id="seg" role="group" aria-label="Network mode">
        <button data-mode="auto">Auto</button>
        <button data-mode="lte">4G</button>
        <button data-mode="4g3g">4G/3G</button>
        <button data-mode="wcdma">3G</button>
        <button data-mode="gsm">2G</button>
      </div>
      <div class="hint" id="modehint"></div>
    </section>

    <section>
      <h2>Walk test <span class="caption" id="sparkCaption">last 15 min</span></h2>
      <div class="card spark-wrap">
        <svg id="spark" viewBox="0 0 800 96" preserveAspectRatio="none" aria-label="Signal history"></svg>
      </div>
    </section>

    <section>
      <h2>Readings</h2>
      <div class="card rows" id="readings"></div>
    </section>
  </div>

  <section id="sms-panel" role="tabpanel" aria-labelledby="tab-messages" hidden>
    <div class="panel-actions">
      <button type="button" id="sms-refresh" class="link-btn">Refresh</button>
    </div>
    <div class="sms-empty" id="sms-empty" hidden>no messages</div>
    <div class="card rows sms-list" id="sms-list"></div>
    <form id="sms-compose" class="field-row">
      <input id="sms-number" class="input" placeholder="Number" autocomplete="off">
      <input id="sms-text" class="input" placeholder="Message" autocomplete="off">
      <button type="submit" class="btn">Send</button>
    </form>
    <div id="sms-status" class="hint"></div>
  </section>

  <section id="ussd-panel" role="tabpanel" aria-labelledby="tab-ussd" hidden>
    <div class="panel-actions">
      <div class="seg" id="ussd-saved"></div>
      <button type="button" id="ussd-manage" class="link-btn">Manage</button>
    </div>
    <div id="ussd-manage-card" class="card pad ussd-manage-card" hidden>
      <div class="ussd-manage-label">Manage saved codes</div>
      <div id="ussd-manage-list" class="ussd-manage-list"></div>
      <form id="ussd-save-form" class="field-row">
        <input id="ussd-save-label" class="input" placeholder="Label" autocomplete="off">
        <input id="ussd-save-code" class="input" placeholder="*310#" autocomplete="off">
        <button type="submit" class="btn">Add</button>
      </form>
      <div id="ussd-manage-msg" class="hint" hidden></div>
    </div>
    <form id="ussd-form" class="field-row">
      <input id="ussd-code" class="input" placeholder="*310#" autocomplete="off">
      <button type="submit" class="btn">Send</button>
    </form>
    <pre id="ussd-out" class="card ussd-out" hidden></pre>
    <form id="ussd-reply-form" class="field-row" hidden>
      <input id="ussd-reply" class="input" placeholder="reply" autocomplete="off">
      <button type="submit" class="btn">Reply</button>
      <button type="button" id="ussd-cancel" class="btn btn-ghost">Cancel</button>
    </form>
    <div id="ussd-spinner" class="hint" hidden>sending&hellip;</div>
  </section>

  <section id="speed-panel" role="tabpanel" aria-labelledby="tab-speed" hidden>
    <div class="card rows" id="speed-results"></div>
    <div class="speed-actions">
      <button type="button" id="speed-run" class="btn">Run test</button>
      <span class="hint" id="speed-status"></span>
      <span class="hint" id="speed-caption">not run yet</span>
    </div>
  </section>

  <footer>
    <button id="pause">Pause</button>
    <label>every
      <select id="interval">
        <option value="1000">1s</option>
        <option value="3000" selected>3s</option>
        <option value="10000">10s</option>
      </select>
    </label>
    <span id="stamp"></span>
  </footer>
</main>

<!-- Order matters: shared helpers, then the tab registry, then the panels that
     register with it. Plain deferred scripts sharing one window.zlt namespace,
     so there is still nothing to build and nothing to fetch off-origin. -->
<script defer src="/static/js/shared.js"></script>
<script defer src="/static/js/theme.js"></script>
<script defer src="/static/js/tabs.js"></script>
<script defer src="/static/js/signal.js"></script>
<script defer src="/static/js/net.js"></script>
<script defer src="/static/js/sms.js"></script>
<script defer src="/static/js/ussd.js"></script>
<script defer src="/static/js/speed.js"></script>
</body>
</html>
