name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Reuses the full 3-OS x 3-Python matrix. A tag that fails tests publishes nothing.
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      is-final: ${{ steps.tag.outputs.is-final }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # vX.Y.Z goes all the way to PyPI; anything else (vX.Y.ZrcN) stops at TestPyPI.
      - name: Classify tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is-final=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is a final release tag: TestPyPI then PyPI."
          else
            echo "is-final=false" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is a prerelease tag: TestPyPI only."
          fi

      # Guards against tagging v0.11.0 while pyproject.toml still says 0.10.0, which
      # would publish the wrong version and burn the number on PyPI permanently.
      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version '$tag_version' but pyproject.toml declares '$pkg_version'"
            exit 1
          fi
          echo "Tag and package version agree: $pkg_version"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # Trusted Publishing. No API token is stored anywhere.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: [build, publish-testpypi]
    if: needs.build.outputs.is-final == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish-pypi]
    if: needs.build.outputs.is-final == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
